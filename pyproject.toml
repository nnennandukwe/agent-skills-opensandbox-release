[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "opensandbox-release-demo"
version = "0.1.0"
description = "Small tutorial package for an OpenSandbox release check"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
