name: OpenSandbox release check
run-name: Release check · ${{ inputs.scenario }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Input or report used to challenge the release check
        type: choice
        required: true
        default: valid
        options: [valid, missing-version, wrong-report]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Check the release contract
        run: python -m unittest discover -s tests -v
      - name: Build a Python wheel
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel
          python -m pip install --no-deps dist/*.whl
          python -m release_demo
      - name: Prepare the release candidate
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: python -m pipeline.build_candidate --source-sha "$GITHUB_SHA" --scenario "$SCENARIO"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate
          path: candidate/
          if-no-files-found: error

  check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate
          path: candidate/
      - name: Install OpenSandbox
        run: python -m pip install -r requirements.txt
      - name: Start the local OpenSandbox server
        run: |
          python -m pipeline.server_config --output "$RUNNER_TEMP/osb.toml" --state "$RUNNER_TEMP/osb.sqlite"
          opensandbox-server --config "$RUNNER_TEMP/osb.toml" > "$RUNNER_TEMP/osb.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/osb.pid"
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:18082/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "OpenSandbox server didn't become ready" >&2
          exit 1
      - name: Run the skill helper and enforce its result
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: >-
          python -m pipeline.gate --config "$RUNNER_TEMP/osb.toml"
          --source-sha "$GITHUB_SHA" --scenario "$SCENARIO"
      - name: Retain the observed result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-evidence
          path: evidence/gate.json
          if-no-files-found: error
      - name: Stop the temporary server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/osb.pid" ]; then
            server_pid=$(cat "$RUNNER_TEMP/osb.pid")
            if kill -0 "$server_pid" 2>/dev/null; then kill "$server_pid"; fi
          fi

  publish:
    needs: [build, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate
          path: candidate/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gate-evidence
          path: evidence/
      - name: Verify the accepted candidate
        run: python -m pipeline.publish_check --source-sha "$GITHUB_SHA"
      - name: Publish the tutorial prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          candidate/*.whl candidate/release-manifest.csv candidate/candidate.json evidence/gate.json
          --title "Tutorial prerelease ${GITHUB_RUN_ID}"
          --notes-file docs/demo-release-notes.md --prerelease --target "$GITHUB_SHA"
